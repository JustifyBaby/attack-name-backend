services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command: ["sh", "-c", "npm run db:migrate:local && exec npm run dev -- --ip 0.0.0.0"]
    ports:
      - "8787:8787"
    volumes:
      - backend-state:/workspaces/attack-name-backend/.wrangler
      - type: bind
        source: ./.dev.vars
        target: /workspaces/attack-name-backend/.dev.vars
        read_only: true
        bind:
          create_host_path: false

volumes:
  backend-state:
